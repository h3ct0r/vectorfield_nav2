# Scenario overlay for the curve follower (plan section 8; the follower itself arrives in M5).
# The follower reads the local costmap's costmap_raw, so it needs the mapped walls as well as the
# laser, and a costmap that is updated, not only published, at its rate: costmap_raw is
# published from the update loop, so publish_frequency above update_frequency has no effect.
# Scenario overlays never set velocity_smoother limits.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]

velocity_smoother:
  ros__parameters:
    scale_velocities: true
