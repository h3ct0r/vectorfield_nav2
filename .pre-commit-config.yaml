# Install once with `pre-commit install`; run on everything with
# `pre-commit run --all-files`.
#
# The `local` hooks at the end need a sourced ROS 2 environment (they run in
# the devcontainers). The CI pre-commit job skips them with
#   SKIP=ament_copyright,ament_xmllint,ament_lint_cmake
# and colcon test runs the same linters through ament_lint_auto.
#
# Every `rev` is an existing tag of its repository; dependabot does not update
# pre-commit hooks, so bump them with `pre-commit autoupdate`.

# Vendored upstream sources are never reformatted or linted, nor are the generated figures and
# the captured RViz screenshots (the demo GIF exceeds check-added-large-files' limit).
exclude: ^(vectorfield_core/(third_party|test/fuzz/corpus)|docs/_static/(figures|screenshots))/

# Node hooks (markdownlint-cli2, prettier-package-xml) run on a pinned, nodeenv-managed Node so
# results do not depend on the host. npm 11 (Node 24, current Homebrew) refuses the git-sourced
# installs pre-commit performs (EALLOWGIT); Node 22 LTS ships npm 10.
default_language_version:
  node: 22.23.3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: fix-byte-order-marker

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
        # Python only; Markdown is left to markdownlint.
        types_or: [python, pyi]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/tier4/pre-commit-hooks-ros
    rev: v0.10.3
    hooks:
      - id: prettier-package-xml
      - id: sort-package-xml

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-github-issue-forms
      - id: check-dependabot
      - id: check-codecov
      - id: check-citation-file-format

  - repo: local
    hooks:
      - id: ament_copyright
        name: ament_copyright
        entry: ament_copyright
        language: system
        types_or: [c, c++, python, cmake]
      - id: ament_xmllint
        name: ament_xmllint
        entry: ament_xmllint
        language: system
        types: [xml]
      - id: ament_lint_cmake
        name: ament_lint_cmake
        entry: ament_lint_cmake
        language: system
        types: [cmake]
