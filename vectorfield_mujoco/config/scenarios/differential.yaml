# Scenario of differential.launch.py: PAL TIAGo on open_10x10 (vectorfield_mujoco.examples).
# An unmapped box sits on the straight path. The global costmap has no obstacle layer, so the
# plan runs through the box: the controller contours around it (obstacle_mode contour), rejoins
# the path and rotates to the goal heading, then does the same on the way back.
description: "TIAGo contours around an unmapped box and rejoins its path"

initial_pose: [-2.0, 0.0, 0.0]

# Map frame; box size is MuJoCo's half-extents. 0.5 m tall: the lidar plane is at 0.0945 m.
obstacles:
  - {type: box, pos: [0.5, 0.0], size: [0.2, 0.2, 0.25]}

# NavigateToPose goals (x, y, yaw), one after the other.
waypoints:
  - [3.0, 0.0, 1.57]
  - [-2.0, 0.0, 3.14]

params:
  global_costmap:
    global_costmap:
      ros__parameters:
        plugins: ["static_layer", "inflation_layer"]

# How record_path films it (record_gallery.sh's clip): a fixed view of the route; the clip leaves
# out the curve's rays, the evaluation point, the field's terms (their sum F stays), the command's
# arc and the braking zone, and draws the robot's path.
recording:
  camera: fixed
  view: {lookat: [0.5, 0.15, 0.25], distance: 4.5, azimuth: 90.0, elevation: -55.0}
  hide: [curve/1, control_point, field/0, field/1, field/2, command/1, goal/5]
  trail: 60.0
