# Scenario overlay of tb3_gazebo_demo.launch.py and tb4_gazebo_demo.launch.py, merged after the
# motion-model overlay. nav2_bringup's Gazebo wrapper starts Nav2 there, in its own component
# container. Scenario overlays never set velocity_smoother limits; those belong to the
# motion-model overlays in config/controller.

# Nav2's default_server_timeout (20 ms) is how long bt_navigator waits for a server to accept a
# goal before the tree fails; Gazebo loads the machine more than the other demos, which use 1 s.
bt_navigator:
  ros__parameters:
    default_server_timeout: 1000

# Lyrical's nav2_bringup runs the servers under lifecycle_manager_nav2 (the name exists only
# there). Without bonds, as the other demos' managers (demo.MANAGER_PARAMETERS): at a shutdown
# signal the bonded manager resets the servers, and the cleanup of bt_navigator or a costmap
# deadlocks with the context's shutdown, so launch kills Nav2's container.
lifecycle_manager_nav2:
  ros__parameters:
    bond_timeout: 0.0
