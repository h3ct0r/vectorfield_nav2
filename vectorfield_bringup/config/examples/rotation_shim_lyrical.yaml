# Example: the vector-field controller as the primary controller of Nav2's RotationShimController,
# Lyrical and later key layout (Humble and Jazzy: rotation_shim_humble_jazzy.yaml).
#
# The shim turns the robot in place toward the path before handing over to the vector field, so
# the controller's own initial rotation (ROTATE_TO_FIELD) is off. On Lyrical the primary has its
# own namespace: the vector-field keys move under FollowPath.primary_controller, and its markers
# to FollowPath/primary_controller/markers. The shim's rotate_to_heading_angular_vel (1.8 rad/s
# by default) is its own and not shared.
#
# Use it as an extra overlay of the demos (it replaces the motion-model overlay's FollowPath):
#   ros2 launch vectorfield_bringup kinematic_sim_demo.launch.py \
#     scenarios:=$(ros2 pkg prefix vectorfield_bringup)/share/vectorfield_bringup/config/examples/rotation_shim_lyrical.yaml
# or copy the FollowPath block into your own nav2_params.yaml.
#
# The shim re-aims the robot at the path whenever it re-checks the heading, which undoes an
# obstacle-contour episode: obstacle_mode contour behind the shim is not supported on Lyrical.
# Tutorial: docs/tutorials/scenarios.md.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # The shim's keys: rotate in place while the path, forward_sampling_distance ahead, is more
      # than angular_dist_threshold (rad) off the heading.
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 3.2
      # The Lyrical shim re-checks the heading every control cycle. Near the goal it would turn the
      # robot back toward the last path pose while the controller turns it to the goal yaw, and
      # the two never settle; the shim makes the final turn itself instead.
      rotate_to_goal_heading: true
      primary_controller:
        plugin: "vectorfield_nav2_controller::VectorFieldController"
        motion_model: "differential"
        use_rotate_to_field: false
        desired_speed: 0.4
        max_linear_vel: 0.5
        max_angular_vel: 1.5
        max_linear_accel: 1.0
        max_linear_decel: 1.0
        max_angular_accel: 3.2
        rotate_to_heading_angular_vel: 1.5
        obstacle_mode: "none"
