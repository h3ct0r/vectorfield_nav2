name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security issues must not be reported here; see SECURITY.md.
        Please check the [documentation](https://h3ct0r.github.io/vectorfield_nav2/) and existing issues first.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Nav2 controller plugin (vectorfield_nav2_controller)
        - Curve follower (vectorfield_curve_follower)
        - Core library (vectorfield_core)
        - Python bindings or tools (vectorfield_py)
        - Simulator, bringup or demos
        - Messages (vectorfield_msgs)
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: distro
    attributes:
      label: ROS 2 distribution
      options:
        - humble
        - jazzy
        - lyrical
        - rolling
        - other (please say which below)
    validations:
      required: true

  - type: input
    id: nav2_version
    attributes:
      label: Nav2 version
      description: For example the output of `ros2 pkg xml nav2_core --tag version`.
      placeholder: "1.3.13"
    validations:
      required: true

  - type: input
    id: vf_version
    attributes:
      label: vectorfield_nav2 version or commit
      placeholder: "0.0.1, or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Built from source (colcon)
        - Binary packages (apt)
        - Devcontainer from this repository
        - Native core build (CMake presets) or pip
    validations:
      required: true

  - type: dropdown
    id: motion_model
    attributes:
      label: Motion model
      description: The `motion_model` parameter.
      options:
        - differential
        - skid_steer
        - omnidirectional
        - ackermann
        - not applicable
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture and robot or simulator.
      placeholder: "Ubuntu 24.04 arm64, TurtleBot3 waffle in the loopback simulator"

  - type: textarea
    id: params
    attributes:
      label: Parameters
      description: The controller or follower parameters you used (the `FollowPath` block or the follower's YAML). Write n/a for documentation or build issues.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, launch files and goals needed to reproduce the problem.
      placeholder: |
        1. ros2 launch vectorfield_bringup ...
        2. Send a goal to ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Screenshots of RViz with the vectorfield markers are very helpful.
    validations:
      required: true

  - type: textarea
    id: field_state
    attributes:
      label: FieldState echo or bag
      description: |
        Output of `ros2 topic echo <ns>/field_state` around the problem (`<ns>` is the plugin name, e.g. `/FollowPath`, or `/curve_follower` for the follower),
        or a link to a rosbag that records `field_state`, `markers`, `/tf`, `/odom`, the plan and `cmd_vel`.
        Write n/a for documentation or build issues.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
