# Legacy path handling (the Legacy group): the parameters of LegacyPathHandler,
# the port of Nav2's FeasiblePathHandler that builds the plan window on Humble to Kilted (Gen A/B).
# The plugin declares them under its own prefix (e.g. FollowPath.prune_distance) only on those
# distros: generate_parameter_library cannot declare conditionally, so they live in their own
# YAML and the listener is constructed only under #if !VF_HAS_PATH_HANDLER. On Lyrical and later
# the controller_server's own path handler builds the window and these keys are not declared.
#
# They are read-only: the window limit (prune_distance) enters the costmap validation rule of the
# configuration, which is checked once at configure.
vectorfield_legacy_path_params:
  prune_distance:
    type: double
    default_value: 2.0
    read_only: true
    description: "Humble to Kilted only. Length of the global plan kept ahead of the robot's
      closest pose (m)."
    validation:
      gt<>: [0.0]
  max_robot_pose_search_dist:
    type: double
    default_value: 0.0
    read_only: true
    description: "Humble to Kilted only. How far along the global plan the robot's closest pose
      is searched (m). 0 selects half the larger side of the local costmap; a negative value
      means unbounded."
  transform_tolerance:
    type: double
    default_value: 0.1
    read_only: true
    description: "Humble to Kilted only. Timeout of the transform of the global plan into the
      costmap frame (s)."
    validation:
      gt_eq<>: [0.0]
  reject_unit_path:
    type: bool
    default_value: false
    read_only: true
    description: "Humble to Kilted only. Reject a global plan with a single pose."
