# Coverage is uploaded by the Jazzy amd64 CI job (action-ros-ci + lcov).
# action-ros-ci clones the repository into ros_ws/src/<random>/vectorfield_nav2,
# so that prefix is stripped to map report paths back to the repository root
# (path-fix pattern from the action-ros-ci README, applied to the repository
# directory because every package is a top-level directory of this repo).
fixes:
  - "ros_ws/src/*/vectorfield_nav2/::"

ignore:
  - "**/third_party/**"
  - "**/test/**"
  - "**/bench/**"

coverage:
  status:
    # Informational; the target is >= 90% on vectorfield_core/src and include.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
