# Motion-model overlay for an omnidirectional (holonomic) base (plan section 8).
# vectorfield_bringup.params.merge() deep-merges it onto nav2_bringup's nav2_params.yaml and
# replaces FollowPath wholesale. Unlisted controller parameters keep their defaults
# (vectorfield_ros/params/vectorfield_common_params.yaml), which validate with the stock
# 3 x 3 m local costmap and the TB3 footprint in both obstacle modes.

controller_server:
  ros__parameters:
    # The stock 0.5 zeroes every measured lateral speed below 0.5 m/s.
    min_y_velocity_threshold: 0.001
    FollowPath:
      plugin: "vectorfield_nav2_controller::VectorFieldController"
      motion_model: "omnidirectional"
      # The demos contour around unmapped obstacles; none only stops before them.
      obstacle_mode: "contour"
      # Defaults, restated because the velocity_smoother limits below must not be lower.
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_lateral_vel: 0.5
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 3.2

# Only the motion-model overlays set these, as full [x, y, theta] lists: every axis at least the
# controller limits (decelerations negative). The stock y = 0 would clamp every lateral command
# to zero, so y is symmetric and at least max_lateral_vel.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.5, 2.0]
    min_velocity: [-0.5, -0.5, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]

# kinematic_sim_demo: the simulated base matches the controller.
vectorfield_sim:
  ros__parameters:
    motion_model: "omnidirectional"
