# Scenario overlay for plans that reverse (M7, docs/design/m7_reversing.md). Merged after the
# motion-model overlay of a differential, skid-steer or Ackermann base:
#
#   ros2 launch vectorfield_bringup kinematic_sim_demo.launch.py motion_model:=ackermann \
#     map:=corridor_door scenarios:=reversing
#
# Smac Hybrid-A* searches Reeds-Shepp primitives, so its plans may back up (a goal behind the
# robot, a three-point turn); its poses carry the vehicle heading, from which the controller
# takes each segment's drive direction. allow_reversing makes the controller follow such plans
# segment by segment, settling within cusp_tolerance at every cusp. Lyrical users may also set
# the path handler's enforce_path_inversion: the controller builds its own window then anyway.
# max_reverse_vel backs up at 0.2 m/s (sensing behind a robot is usually poorer); obstacles on a
# reverse leg are contoured like forward ones.
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: true
      cusp_tolerance: 0.05
      max_reverse_vel: 0.2

planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"
      minimum_turning_radius: 0.5
      reverse_penalty: 2.0
      allow_unknown: true
      tolerance: 0.25
      max_planning_time: 5.0
