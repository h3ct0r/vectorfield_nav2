# Scenario of omnidirectional.launch.py: the TidyBot base on open_10x10
# (vectorfield_mujoco.examples). The curve follower drives the superellipse |x/2|^4 + |y/1.5|^4 = 1,
# a 4 m x 3 m rounded rectangle, with omni_heading_policy fixed: the base strafes around it
# without turning. run_scenario first drives to the curve with NavigateToPose (send_curve.py).
description: "TidyBot strafes around a rounded rectangle at a fixed heading"

initial_pose: [0.0, 0.0, 0.0]

curve: superellipse
laps: 2

params:
  curve_follower:
    ros__parameters:
      omni_heading_policy: "fixed"

# How record_path films it (record_gallery.sh's clip): a fixed view of the curve; the clip leaves
# out the curve's rays, the evaluation point, the field's terms (their sum F stays), the command's
# arc and the braking zone.
recording:
  camera: fixed
  view: {lookat: [0.0, -0.2, 0.0], distance: 5.0, azimuth: 90.0, elevation: -62.0}
  hide: [curve/1, control_point, field/0, field/1, field/2, command/1, goal/5]
