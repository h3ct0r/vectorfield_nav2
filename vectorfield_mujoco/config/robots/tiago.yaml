# Robot overlay: PAL TIAGo (MuJoCo Menagerie pal_tiago/tiago_velocity.xml, arm tucked), merged
# after vectorfield_bringup's config/controller/differential.yaml and config/mujoco_sim.yaml.
# Controller keys merge into the motion-model overlay's FollowPath (no plugin key here).
#
# Limits: the wheel velocity servos stop at 5 rad/s; with the model's 0.098 m wheels and 0.403 m
# track that is 0.49 m/s straight or 2.4 rad/s in place, shared between the two when turning.
# The controller and the smoother stay below both.

controller_server:
  ros__parameters:
    FollowPath:
      desired_speed: 0.3
      max_linear_vel: 0.4
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 3.2

# The round base, 0.27 m in radius, with a small margin. The collision monitor's
# FootprintApproach polygon follows /local_costmap/published_footprint, so it uses it too.
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.28
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.28

# Full [x, y, theta] lists (vectorfield_bringup/config/controller/README.md): x and theta at
# least the controller limits and within the wheels' (decelerations negative), y zero.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.45, 0.0, 2.0]
    min_velocity: [-0.45, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# The base laser (SICK TiM551 on the real robot) at the model's base_laser site, 0.202 m ahead of
# base_link and 0.0945 m above the ground, published as base_scan; 10 m of range.
mujoco_sim:
  ros__parameters:
    scan_frame: "base_scan"
    scan_range_max: 10.0
