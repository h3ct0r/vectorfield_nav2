# Rolling: nightly and non-gating. Nav2 is not released into Rolling, so this
# builds against the Nav2 nightly image (Nav2 main in /root/nav2_ws/install).
#
# - One bash step, not action-ros-ci: that action sources only
#   /opt/ros/<distro>/setup.sh, and Actions never runs /ros_entrypoint.sh, so it
#   would not see the Nav2 workspace.
# - Launch tests are excluded (-LE launch_test): the image copies /opt/ros and
#   the Nav2 install tree but not the system libraries in /usr (for example
#   GraphicsMagick for map_server). Lyrical has the same Nav2 API and runs them.
# - The image's ROS packages are all on AMENT_PREFIX_PATH, so rosdep on our
#   sources installs none of their system dependencies (for example
#   libexpected-dev, which rsl under generate_parameter_library needs). A first
#   rosdep pass over the installed share trees installs only those system keys.
# - No apt upgrade (it would drift the ABI under the prebuilt Nav2) and no
#   rosdep check (Nav2 keys do not resolve in Rolling's rosdistro by design).
# - A failure opens, or comments on, a tracking issue.

name: Rolling (nightly)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rolling:
    name: rolling (Nav2 main nightly)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ros-navigation/nav2_docker:rolling-nightly-standard
    continue-on-error: true
    timeout-minutes: 120
    env:
      # rosdep installs vectorfield_mujoco's python3-mujoco-pip key with pip (PEP 668).
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      # As in .devcontainer/rolling/Dockerfile: simulators and GUI keys we never build against.
      VF_ROLLING_SKIP_KEYS: >-
        slam_toolbox turtlebot3_gazebo gazebo_ros_pkgs ros_gz ros_gz_sim ros_gz_bridge rviz2
        nav2_rviz_plugins nav2_bringup nav2_system_tests nav2_minimal_tb3_sim
        nav2_minimal_tb4_description nav2_minimal_tb4_sim
    outputs:
      outcome: ${{ steps.build_test.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ws/src/vectorfield_nav2

      - id: build_test
        name: rosdep, build and test
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/rolling/setup.bash
          source /root/nav2_ws/install/setup.bash
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # rosdep installs vectorfield_mujoco's pip key; make sure pip itself is there.
          apt-get install -y --no-install-recommends python3-pip
          rosdep update --rosdistro rolling
          rosdep install -y -r --ignore-src --rosdistro rolling \
            --from-paths /opt/ros/rolling/share /root/nav2_ws/install/*/share \
            -t build_export -t buildtool_export -t exec --skip-keys "${VF_ROLLING_SKIP_KEYS}"
          rosdep install --from-paths ws/src --ignore-src -y -r --rosdistro rolling
          cd ws
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo --no-warn-unused-cli
          colcon test --event-handlers console_direct+ --ctest-args -LE launch_test
          colcon test-result --verbose

      - name: Upload colcon logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: colcon-logs-rolling
          path: ws/log
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report failure
    needs: rolling
    if: ${{ !cancelled() && needs.rolling.outputs.outcome != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Rolling nightly build is failing'
          number=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "Still failing: ${RUN_URL}"
          else
            gh issue create --title "${title}" --body "$(printf '%s\n\n%s\n' \
              "The non-gating Rolling job (Nav2 main nightly image) failed: ${RUN_URL}" \
              'Close this issue once a nightly run passes again.')"
          fi
