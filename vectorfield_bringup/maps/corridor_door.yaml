# A 2 m wide, 12 m long corridor (x from -1 to 11 m, |y| < 1 m, 0.1 m walls) crossed at x = 5 m
# by a 0.2 m wall with a 0.8 m door. The door leaves 0.4 m on each side of its centre line: wider
# than the TB3's 0.22 m radius, so the path through it is free and contouring must not engage,
# but narrower than the auto contour distance (0.47 m). The robot starts at (0, 0).
image: corridor_door.pgm
mode: trinary
resolution: 0.05
origin: [-1.1, -1.1, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196
