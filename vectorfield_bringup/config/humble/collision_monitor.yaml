# Humble only (plan section 8): Humble's navigation_launch.py has no collision_monitor, and its
# velocity smoother and behaviour server both publish cmd_vel. The demos therefore start
# collision_monitor with this file under their own lifecycle_manager_collision_monitor, in the
# Nav2 component container, and vectorfield_sim listens on cmd_vel_safe.
# Real Humble robots use the same wiring. The polygon mirrors the stock Jazzy chain: slow down
# when the footprint would hit a laser point within 1.2 s.

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"
    cmd_vel_out_topic: "cmd_vel_safe"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      # Humble's max_points is Jazzy's min_points - 1 (the stock Jazzy chain uses 6).
      max_points: 5
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
