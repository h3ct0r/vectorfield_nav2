# Scenario of curve_following.launch.py: the Scout Mini on open_10x10
# (vectorfield_mujoco.examples). The curve follower drives laps of the lemniscate of Bernoulli
# (a = 2 m), crossing itself at the origin; run_scenario first drives to the curve with
# NavigateToPose (send_curve.py).
description: "Scout Mini laps a lemniscate with the curve follower"

initial_pose: [0.0, -1.5, 0.0]

curve: lemniscate_bernoulli
laps: 2

# How record_path films it (record_gallery.sh's clip): a fixed view of the curve; the clip leaves
# out the curve's rays, the evaluation point, the field's terms (their sum F stays), the command's
# arc and the braking zone.
recording:
  camera: fixed
  view: {lookat: [0.0, -0.25, 0.0], distance: 4.6, azimuth: 90.0, elevation: -60.0}
  hide: [curve/1, control_point, field/0, field/1, field/2, command/1, goal/5]
