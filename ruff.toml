# Python lint and format for the whole repository (run through pre-commit).
# ament_flake8 and ament_pep257 are excluded from ament_lint_auto, so ruff is
# the only Python linter. Humble ships Python 3.10.
line-length = 99
target-version = "py310"
extend-exclude = [
  "**/third_party/**",
  "install",
  "log",
  ".research",
]

[format]
quote-style = "single"

[lint]
select = ["E", "F", "W", "I", "D"]
# W191, D206 and D300 conflict with the formatter.
# D100/D104/D105/D107: module, package, magic-method and __init__ docstrings
# are optional.
ignore = ["W191", "D206", "D300", "D100", "D104", "D105", "D107"]

[lint.pydocstyle]
convention = "pep257"
