# Scenario overlay: bt_navigator runs the FollowCurve example tree for NavigateToPose
# (docs/behavior_tree.md). Use it with curve_follower_demo:
#
#   ros2 launch vectorfield_bringup curve_follower_demo.launch.py scenarios:=follow_curve_bt
#
# A NavigateToPose goal (RViz's 2D Goal Pose) is then the approach pose: the robot drives there
# with Nav2 and follows the curve of behavior_trees/follow_curve.xml. The bare tree name resolves
# to this package's behavior_trees; params.merge() appends plugin_lib_names to Humble's full stock
# list. Inside bt_navigator, navigate_to_pose stays active for the whole tree, so the follower's
# interlock leaves out the navigator actions; the tree runs FollowPath and FollowCurve one after
# the other. Replace follow_curve.xml with follow_curve_patrol.xml for the patrol. bt_navigator
# creates the tree when it activates, and each action node then waits wait_for_service_timeout
# for its server: the follower starts under its own lifecycle manager, so it gets 10 s.

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: follow_curve.xml
    plugin_lib_names: ["vectorfield_follow_curve_action_bt_node"]
    wait_for_service_timeout: 10000

curve_follower:
  ros__parameters:
    exclusive_actions: ["follow_path", "spin", "backup", "drive_on_heading", "assisted_teleop",
      "dock_robot", "undock_robot", "follow_object"]
