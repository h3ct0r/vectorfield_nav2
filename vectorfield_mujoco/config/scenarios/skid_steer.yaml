# Scenario of skid_steer.launch.py: the Scout Mini in corridor_door (vectorfield_mujoco.examples).
# The 0.6 m wide robot drives through the 0.8 m door at x = 5 m to the end of the 2 m corridor,
# turns around in place and drives back: tracking a narrow passage with slip compensation.
description: "Scout Mini through a door and back, with skid-slip compensation"

initial_pose: [0.0, 0.0, 0.0]

waypoints:
  - [9.0, 0.0, 0.0]
  - [0.0, 0.0, 3.14]

# How record_path films it (record_gallery.sh's clip): a camera following the robot from behind
# and to the right of its way out; the clip leaves out the curve's rays, the evaluation point, the
# field's terms (their sum F stays), the command's arc and the braking zone, and draws the
# robot's path.
recording:
  camera: follow
  view: {distance: 3.0, azimuth: 35.0, elevation: -38.0, height: 0.1}
  hide: [curve/1, control_point, field/0, field/1, field/2, command/1, goal/5]
  trail: 60.0
