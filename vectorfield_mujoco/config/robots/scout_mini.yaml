# Robot overlay: the AgileX Scout Mini (models/scout_mini), merged after vectorfield_bringup's
# config/controller/skid_steer.yaml and config/mujoco_sim.yaml.
#
# Limits: the in-wheel servos reach 70 rad/s (6.1 m/s with the 0.0875 m wheels); the controller
# keeps the overlay's 0.5 m/s. The base realises a little less than half the commanded yaw rate
# (the wheels skid; wheelbase and track are about equal), in place and on arcs, up to 3 rad/s.
# max_angular_vel, which clamps the compensated command (below), so caps the real yaw rate at
# about 1.1 rad/s.

controller_server:
  ros__parameters:
    FollowPath:
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_angular_vel: 2.5
      max_angular_accel: 3.2
      rotate_to_heading_angular_vel: 1.5
      min_in_place_angular_vel: 0.25
      # Slip compensation, identified on the MuJoCo model as on a real robot
      # (docs/tutorials/field_testing.md, stage 6). With
      #   ros2 launch vectorfield_mujoco mujoco_nav2.launch.py robot:=scout_mini \
      #       initial_pose_x:=-2.0 initial_pose_y:=-2.0
      # running, `ros2 run vectorfield_bringup identify_skid_slip.py --yes --use-sim-time
      # --repeats 2 --max-distance 4.0` drives turns in place and arcs (0.2 m/s, 0.6 rad/s)
      # through Nav2's command chain and compares the commanded motion with the pose: here
      # mujoco_sim's odom, the ground truth, which sees the slip (on a robot, an IMU-fused or
      # localisation pose). Two runs gave eta_psi 0.451 and 0.450 (spread 0.001, in place and on
      # the arcs alike) and x_ICR 0.003 m (spread 0.004 and 0.003).
      # Rerun it after changing the model's geometry or friction.
      skid_yaw_rate_efficiency: 0.45
      skid_icr_offset: 0.003

# The wheels' outer edges, 0.627 m x 0.549 m (the manual's overall size; the chassis lies within
# them). The collision monitor's FootprintApproach polygon follows
# /local_costmap/published_footprint, so it uses it too.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.315, 0.275], [0.315, -0.275], [-0.315, -0.275], [-0.315, 0.275]]"
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.315, 0.275], [0.315, -0.275], [-0.315, -0.275], [-0.315, 0.275]]"

# Full [x, y, theta] lists: x and theta at least the controller limits and within the wheels'
# (decelerations negative), y zero.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 3.0]
    min_velocity: [-0.5, 0.0, -3.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# The 2D lidar puck on top of the chassis, 0.29 m above the ground over base_link, published
# as base_scan.
mujoco_sim:
  ros__parameters:
    scan_frame: "base_scan"
    scan_range_max: 12.0
