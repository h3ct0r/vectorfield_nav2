# markdownlint configuration (used by markdownlint-cli2 in pre-commit).
default: true

# Line length: prose is not hard-wrapped.
MD013: false

# Inline HTML: allowed only for badges, line breaks, collapsible blocks and the README's gallery
# table.
MD033:
  allowed_elements:
    - a
    - br
    - details
    - img
    - p
    - picture
    - source
    - summary
    - sub
    - sup
    - table
    - td
    - tr

# Repeated headings are fine in different sections (changelogs, guides).
MD024:
  siblings_only: true

# First line need not be a top-level heading (MyST front matter, templates).
MD041: false

# Table pipe spacing is cosmetic; both `|---|` and `| --- |` are accepted.
MD060: false
