# Shared overlay of the MuJoCo examples (vectorfield_mujoco.examples.merged_params), merged after
# vectorfield_bringup's motion-model overlay and before config/robots/<robot>.yaml. Like
# vectorfield_bringup's scenario overlays it never sets velocity smoother limits.

velocity_smoother:
  ros__parameters:
    # Scale every axis together when one hits a limit, so the commanded curvature survives.
    scale_velocities: true

# The simulator. The launch sets robot, world_map, obstacles, the initial pose, cmd_vel_topic
# (cmd_vel_safe on Humble, after collision_monitor), the views and overlay_topics.
mujoco_sim:
  ros__parameters:
    # 500 Hz physics in 10 ms ticks; every tick publishes /clock (vectorfield_sim's 100 Hz).
    physics_rate: 500.0
    clock_rate: 100.0
    cmd_vel_timeout: 0.5
    # odom, its TF and ~/ground_truth; per tick they would flood Nav2's odom subscribers.
    odom_rate: 50.0
    scan_beams: 360
    scan_rate: 10.0
    # A scan arrives this long after its stamp, once its transform is out (vectorfield_sim's
    # README explains why).
    scan_latency: 0.02
    camera_rate: 10.0
    camera_size: "640x360"
    camera_mode: "chase"
    record_fps: 30.0
    record_size: "960x540"
