# An L-shaped corridor, 1.2 m wide, with a sharp 90° left corner, in a 10 m × 10 m map
# (x and y from -2 to 8 m); everything outside the corridor is occupied. The first leg runs
# along +x (x from -1 to 6.6 m, |y| < 0.6 m), the second along +y (|x - 6| < 0.6 m, y up to
# 7 m), so the centre lines meet at (6, 0). The robot starts at (0, 0) facing +x; a goal at
# (6, 6) takes it around the corner.
image: corridor_corner.pgm
mode: trinary
resolution: 0.05
origin: [-2.0, -2.0, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196
