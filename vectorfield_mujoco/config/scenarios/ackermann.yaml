# Scenario of ackermann.launch.py: the own car on open_10x10 (vectorfield_mujoco.examples). Smac
# Hybrid-A* (DUBIN, the Ackermann overlay) plans forward-only paths; an unmapped box stands just
# beside the first leg, which the global costmap does not see (no obstacle layer), and the
# controller's CBF safety filter (obstacle_mode cbf) keeps the car's turning margin from it. The
# car then makes a U-turn at its 0.5 m turning radius and drives back.
description: "Car keeps its CBF turning margin from a box beside the path, then U-turns"

initial_pose: [-3.5, -1.0, 0.0]

# 0.5 m tall: the lidar plane is at 0.195 m.
obstacles:
  - {type: box, pos: [-0.5, -0.55], size: [0.15, 0.15, 0.25]}

# The U-turn (2 m wide, so twice the turning radius) stays 1.5 m clear of the east wall.
waypoints:
  - [2.0, -1.0, 0.0]
  - [2.0, 1.0, 3.14]
  - [-3.5, 1.0, 3.14]

params:
  controller_server:
    ros__parameters:
      FollowPath:
        obstacle_mode: "cbf"
  global_costmap:
    global_costmap:
      ros__parameters:
        plugins: ["static_layer", "inflation_layer"]
