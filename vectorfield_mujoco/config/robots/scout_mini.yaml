# Robot overlay: the AgileX Scout Mini (models/scout_mini), merged after vectorfield_bringup's
# config/controller/skid_steer.yaml and config/mujoco_sim.yaml.
#
# Limits: the in-wheel servos reach 70 rad/s (5.6 m/s with the 0.08 m wheels); the controller
# keeps the overlay's 0.5 m/s. In place the base realises only about half of the commanded yaw
# rate (the wheels skid), so max_angular_vel lets the compensated command (below) reach about
# 1.3 rad/s of real yaw rate.

controller_server:
  ros__parameters:
    FollowPath:
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_angular_vel: 2.5
      max_angular_accel: 3.2
      rotate_to_heading_angular_vel: 1.5
      min_in_place_angular_vel: 0.25
      # Slip compensation, identified on the MuJoCo model as on a real robot
      # (docs/tutorials/field_testing.md, stage 6). With
      #   ros2 launch vectorfield_mujoco mujoco_nav2.launch.py robot:=scout_mini \
      #       initial_pose_x:=-2.0 initial_pose_y:=-2.0
      # running, `ros2 run vectorfield_bringup identify_skid_slip.py --yes --use-sim-time
      # --repeats 2 --max-distance 4.0` drives turns in place and arcs (0.2 m/s, 0.6 rad/s)
      # through Nav2's command chain and compares the commanded motion with the pose: here
      # mujoco_sim's odom, the ground truth, which sees the slip (on a robot, an IMU-fused or
      # localisation pose). It gave eta_psi 0.517 (spread 0.020; 0.53 in place, 0.50 on the
      # arcs) and x_ICR 0.008 m (spread 0.009). Rerun it after changing the model's friction.
      skid_yaw_rate_efficiency: 0.52
      skid_icr_offset: 0.008

# The wheels' outer contact edges: 0.474 m x 0.60 m (the chassis is inside them). The collision
# monitor's FootprintApproach polygon follows /local_costmap/published_footprint, so it uses it
# too.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.237, 0.30], [0.237, -0.30], [-0.237, -0.30], [-0.237, 0.30]]"
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.237, 0.30], [0.237, -0.30], [-0.237, -0.30], [-0.237, 0.30]]"

# Full [x, y, theta] lists: x and theta at least the controller limits and within the wheels'
# (decelerations negative), y zero.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 3.0]
    min_velocity: [-0.5, 0.0, -3.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# The 2D lidar puck on top of the chassis, 0.282 m above the ground over base_link, published
# as base_scan.
mujoco_sim:
  ros__parameters:
    scan_frame: "base_scan"
    scan_range_max: 12.0
