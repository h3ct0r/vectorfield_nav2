# Motion-model overlay for a car-like (Ackermann) base.
# vectorfield_bringup.params.merge() deep-merges it onto nav2_bringup's nav2_params.yaml and
# replaces FollowPath wholesale, and the goal checker and planner blocks too because their
# plugins change. Unlisted controller parameters keep their defaults
# (vectorfield_ros/params/vectorfield_common_params.yaml).
#
# A car cannot turn in place, so:
# - the planner is Smac Hybrid-A* with forward-only Dubins motions and the car's turning radius;
# - the goal checker checks the position only;
# - NavigateToPose runs navigate_w_replanning_time.xml, a stock tree without the Spin recovery
#   (merge() resolves the name in nav2_bt_navigator/behavior_trees). The stock recovery trees,
#   and every stock NavigateThroughPoses tree, use Spin.
# Obstacle contouring is on, with the car's auto distances (docs: Obstacle avoidance, Ackermann):
# lambda = min_turning_radius + w_lat + 0.05 = 0.77 m, turn-in band up to D'_in = 1.47 m. The
# local costmap is 4 m x 4 m so that the band fits the rolling window. An obstacle the car cannot
# drive around without reversing stops it, and Nav2 replans.

controller_server:
  ros__parameters:
    general_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: "vectorfield_nav2_controller::VectorFieldController"
      motion_model: "ackermann"
      obstacle_mode: "contour"
      # Rear-axle turning radius; matches the planner and vectorfield_sim below.
      min_turning_radius: 0.5
      reference_point_offset: 0.0
      # Defaults, restated because the velocity_smoother limits below must not be lower.
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 3.2

# A 4 m window: the car's contour band (D'_in = 1.47 m) and gate lookahead (1.57 m) need more than
# half of the stock 3 m one.
local_costmap:
  local_costmap:
    ros__parameters:
      width: 4
      height: 4

planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 0.5
      allow_unknown: true
      tolerance: 0.25
      max_planning_time: 5.0

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "navigate_w_replanning_time.xml"

# Only the motion-model overlays set these, as full [x, y, theta] lists: x and theta at least the
# controller limits (decelerations negative), y zero.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# kinematic_sim_demo: the simulated car matches the controller.
vectorfield_sim:
  ros__parameters:
    motion_model: "ackermann"
    min_turning_radius: 0.5
    reference_point_offset: 0.0
