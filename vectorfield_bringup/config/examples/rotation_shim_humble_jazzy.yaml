# Example: the vector-field controller as the primary controller of Nav2's RotationShimController,
# Humble and Jazzy key layout (Lyrical and later: rotation_shim_lyrical.yaml).
#
# The shim turns the robot in place toward the path before handing over to the vector field, so
# the controller's own initial rotation (ROTATE_TO_FIELD) is off. On Humble and Jazzy the primary
# is named by a string, and its keys sit next to the shim's under FollowPath. The shim declares
# rotate_to_heading_angular_vel (1.8 rad/s) and max_angular_accel under the same prefix, so both
# controllers share them; they are set here so that neither exceeds max_angular_vel.
#
# Use it as an extra overlay of the demos (it replaces the motion-model overlay's FollowPath):
#   ros2 launch vectorfield_bringup kinematic_sim_demo.launch.py \
#     scenarios:=$(ros2 pkg prefix vectorfield_bringup)/share/vectorfield_bringup/config/examples/rotation_shim_humble_jazzy.yaml
# or copy the FollowPath block into your own nav2_params.yaml.
#
# The shim re-aims the robot at the path whenever it re-checks the heading, which undoes an
# obstacle-contour episode: obstacle_mode contour behind the shim is supported only on Jazzy with
# rotate_to_heading_once: true. Tutorial: docs/tutorials/scenarios.md.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "vectorfield_nav2_controller::VectorFieldController"
      # The shim's keys: rotate in place while the path, forward_sampling_distance ahead, is more
      # than angular_dist_threshold (rad) off the heading.
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      # Shared by the shim and the vector-field controller.
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 3.2
      # The vector-field controller's keys, unprefixed under FollowPath.
      motion_model: "differential"
      use_rotate_to_field: false
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      obstacle_mode: "none"
