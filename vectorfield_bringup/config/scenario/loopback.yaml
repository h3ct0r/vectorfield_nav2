# Scenario overlay of loopback_demo.launch.py, merged after the motion-model
# overlay. Nav2's loopback simulator keeps the stock loopback_simulator parameters (base_footprint,
# base_scan); Nav2 runs as in kinematic_sim_demo, Lyrical's lifecycle_manager_navigation without
# bonds (vectorfield_bringup.demo.nav2_demo_actions). Scenario overlays never set velocity_smoother limits; those belong to the
# motion-model overlays in config/controller.

velocity_smoother:
  ros__parameters:
    # Scale every axis together when one hits a limit, so the commanded curvature survives.
    scale_velocities: true

# Nav2's default_server_timeout (20 ms) is how long bt_navigator waits for a server to accept a
# goal before the tree fails. A loaded machine (a CI runner, a Docker VM) can miss it, which
# aborts a NavigateToPose goal before the planner has run; FollowCurve's trees use 1000 ms too.
bt_navigator:
  ros__parameters:
    default_server_timeout: 1000
