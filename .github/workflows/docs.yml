# Builds the Sphinx site (Doxygen XML via Breathe; no ROS needed) on every pull
# request and push to main, with warnings as errors. Pushes to main deploy it
# to GitHub Pages (repository setting: Pages source = GitHub Actions).

name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Install Python requirements
        run: |
          python -m venv "${RUNNER_TEMP}/docs-venv"
          "${RUNNER_TEMP}/docs-venv/bin/python" -m pip install -r docs/requirements.txt

      - name: Doxygen (XML for Breathe)
        working-directory: docs
        run: doxygen Doxyfile

      - name: Sphinx (warnings are errors)
        run: >-
          "${RUNNER_TEMP}/docs-venv/bin/sphinx-build" -W --keep-going -b html
          docs docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
