# Robot overlay: the Stanford TidyBot base (MuJoCo Menagerie stanford_tidybot/base.xml), merged
# after vectorfield_bringup's config/controller/omnidirectional.yaml and config/mujoco_sim.yaml.
# The base is ideal holonomic: planar x, y and yaw joints driven by velocity servos
# (vectorfield_mujoco.registry), no wheels.
#
# Limits: the servos stop at 1.5 m/s per axis and 3 rad/s; the motion-model overlay's controller
# limits (0.5 m/s, 0.5 m/s lateral, 1.5 rad/s) and smoother limits (0.5, 0.5, 2.0) are within
# them and are kept.

controller_server:
  ros__parameters:
    FollowPath:
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_lateral_vel: 0.5
      max_angular_vel: 1.5

# The 0.48 m square base with a small margin. The collision monitor's FootprintApproach polygon
# follows /local_costmap/published_footprint, so it uses it too.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.245, 0.245], [0.245, -0.245], [-0.245, -0.245], [-0.245, 0.245]]"
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.245, 0.245], [0.245, -0.245], [-0.245, -0.245], [-0.245, 0.245]]"

# Full [x, y, theta] lists: every axis at least the controller limits and within the servos'
# (decelerations negative); y symmetric for the lateral motion.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.5, 2.0]
    min_velocity: [-0.5, -0.5, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]

# A 2D lidar at the base_laser site, 0.3 m above the ground on the base's centre, published as
# base_scan.
mujoco_sim:
  ros__parameters:
    scan_frame: "base_scan"
    scan_range_max: 12.0
