# Robot overlay: the own front-steered car (models/ackermann_car), merged after
# vectorfield_bringup's config/controller/ackermann.yaml and config/mujoco_sim.yaml. The car is
# sized for that overlay: base_link is the rear-axle centre (reference_point_offset 0), and a
# 0.5 m turning radius at the rear axle (min_turning_radius, the Smac Hybrid DUBIN planner's
# minimum_turning_radius) needs 0.59 rad on the inner wheel, within the hinges' 0.65 rad.
#
# Limits: the rear wheel servos stop at 30 rad/s, 1.5 m/s with the 0.05 m wheels; the overlay's
# 0.5 m/s and 1.5 rad/s (and v / R_min = 1.0 rad/s at full lock) are within them and are kept.

controller_server:
  ros__parameters:
    FollowPath:
      min_turning_radius: 0.5
      reference_point_offset: 0.0
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_angular_vel: 1.5

# The 0.42 m x 0.25 m body about the rear axle. The collision monitor's FootprintApproach
# polygon follows /local_costmap/published_footprint, so it uses it too.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.34, 0.125], [0.34, -0.125], [-0.08, -0.125], [-0.08, 0.125]]"
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.34, 0.125], [0.34, -0.125], [-0.08, -0.125], [-0.08, 0.125]]"

# Full [x, y, theta] lists: x and theta at least the controller limits and within the wheels'
# (decelerations negative), y zero.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# The lidar puck on the cabin: 0.07 m ahead of the rear axle, 0.195 m above the ground,
# published as base_scan.
mujoco_sim:
  ros__parameters:
    scan_frame: "base_scan"
    scan_range_max: 12.0
