# Scenario overlay of kinematic_sim_demo.launch.py (plan section 8), merged after the
# motion-model overlay. Scenario overlays never set velocity_smoother limits; those belong to the
# motion-model overlays in config/controller.

velocity_smoother:
  ros__parameters:
    # Scale every axis together when one hits a limit, so the commanded curvature survives.
    scale_velocities: true

# Nav2's default_server_timeout (20 ms) is how long bt_navigator waits for a server to accept a
# goal before the tree fails. A loaded machine (a CI runner, a Docker VM) can miss it, which
# aborts a NavigateToPose goal before the planner has run; FollowCurve's trees use 1000 ms too.
bt_navigator:
  ros__parameters:
    default_server_timeout: 1000

# The kinematic simulator. The launch file sets cmd_vel_topic (cmd_vel_safe on Humble, after
# collision_monitor) and the initial pose; the motion-model overlay sets motion_model.
vectorfield_sim:
  ros__parameters:
    step_size: 0.01
    real_time_factor: 1.0
    cmd_vel_timeout: 0.5
    # odom, its TF and ~/ground_truth; per 10 ms step they would flood Nav2's odom subscribers.
    odom_rate: 50.0
    scan_beams: 360
    scan_rate: 10.0
    scan_range_max: 30.0
    # A scan arrives this long after its stamp, once its transform is out (see the sim's README).
    scan_latency: 0.02
