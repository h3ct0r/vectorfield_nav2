# Template: the vector-field controller in your own Nav2 parameter file, car-like (Ackermann)
# base.
#
# Copy each block into the section of the same name in your nav2_params.yaml (merge, do not
# append a second section; replace the goal checker and GridBased blocks whole), then replace the
# limits and the turning radius with your car's. Keys not listed keep their defaults
# (docs: Parameters). The values below validate without warnings with the stock 3 m x 3 m local
# costmap and a TurtleBot-sized footprint.
#
# A car cannot turn in place, so the rest of Nav2 must not ask it to:
# - the planner returns drivable paths: Smac Hybrid-A* with forward-only Dubins motions and the
#   car's turning radius (the controller rejects plans that reverse, with InvalidPath);
# - the goal checker checks the position only (there is no rotation to the goal yaw);
# - the behaviour tree has no Spin (the stock recovery trees and every stock
#   NavigateThroughPoses tree use it).
# Obstacle contouring is not supported for Ackermann bases in 0.x: obstacles stop the car and
# Nav2 replans.
#
# Check the file before deploying:
#   vf-tune nav2_params.yaml
# Tutorial: docs/tutorials/your_robot.md.

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: "vectorfield_nav2_controller::VectorFieldController"
      # Read-only: set before the controller is configured. Ackermann always uses heading
      # tracking at the reference point.
      motion_model: "ackermann"
      tracking_law: "auto"
      # Rear-axle turning radius (m); the planner below uses the same value.
      min_turning_radius: 0.5
      # The reference point along body x from base_link (m): 0 when base_link is on the rear
      # axle.
      reference_point_offset: 0.0
      # Below this forward speed the car cannot turn, so a positive command is raised to it
      # while following.
      ackermann_min_speed: 0.05
      # The car's real limits. Every command also satisfies |omega| <= v / min_turning_radius.
      max_linear_vel: 0.5
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 3.2
      # The field: speed along the path (at most max_linear_vel) and convergence gain (1/m).
      # The ackermann_curvature warning appears when the field needs more curvature than
      # 1 / min_turning_radius; lower convergence_gain then.
      desired_speed: 0.4
      convergence_gain: 2.0
      heading_gain: 2.0
      # Goal approach: brake over this path length, at least desired_speed^2 / max_linear_decel.
      terminal_braking_distance: 0.5
      min_approach_speed: 0.05
      obstacle_mode: "none"
      use_collision_detection: true
      collision_check_horizon: 1.5
      stop_margin: 0.1

planner_server:
  ros__parameters:
    GridBased:
      # Humble spells the plugin "nav2_smac_planner/SmacPlannerHybrid".
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 0.5
      allow_unknown: true
      tolerance: 0.25
      max_planning_time: 5.0

bt_navigator:
  ros__parameters:
    # A stock NavigateToPose tree without Spin. nav2_bringup's launch files expand
    # $(find-pkg-share ...) in the parameter file; with a launch file that does not, write the
    # absolute path of nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml.
    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_replanning_time.xml"

# x and theta at least the controller's limits (decelerations negative), y zero.
velocity_smoother:
  ros__parameters:
    scale_velocities: true
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# Jazzy and later: controller_server (cmd_vel_nav) -> velocity_smoother (cmd_vel_smoothed) ->
# collision_monitor -> cmd_vel. Keep your distro's stock collision_monitor section; the keys
# below are the ones that interact with the controller (see the differential template). Humble:
# add a collision_monitor as vectorfield_bringup does (config/humble/collision_monitor.yaml).
collision_monitor:
  ros__parameters:
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      time_before_collision: 1.2
      simulation_time_step: 0.1
