# Template: the vector-field controller in your own Nav2 parameter file, differential base.
#
# Copy each block into the section of the same name in your nav2_params.yaml (merge, do not
# append a second section), then replace the limits with your robot's. Keys not listed keep their
# defaults (docs: Parameters). The values below are the defaults for a TurtleBot-sized base with
# the stock 3 m x 3 m local costmap; they validate without warnings in both obstacle modes.
# The footprint is not set here: the controller reads it from the local costmap
# (footprint or robot_radius).
#
# Check the file before deploying:
#   vf-tune nav2_params.yaml
# and read controller_server's log at configure time: errors make configure() fail, warnings
# are logged with a code (docs: Tuning guide, "Validator findings").
#
# Tutorial: docs/tutorials/your_robot.md. The skid-steer variant differs only in
# motion_model: "skid_steer" and min_in_place_angular_vel: 0.25.

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["general_goal_checker"]
    # Position and yaw: the controller stops on the goal, then turns in place to the goal yaw
    # (ROTATE_TO_HEADING).
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: "vectorfield_nav2_controller::VectorFieldController"
      # Read-only: set before the controller is configured. tracking_law auto selects feedback
      # linearisation for a differential base.
      motion_model: "differential"
      tracking_law: "auto"
      # The base's real limits. When one binds, the whole command is scaled, so its direction
      # (the path's curvature) is kept.
      max_linear_vel: 0.5
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 3.2
      # The field: speed along the path (at most max_linear_vel) and convergence gain (1/m).
      desired_speed: 0.4
      convergence_gain: 2.0
      # Feedback linearisation tracks a point this far ahead of base_link (m); the base cuts
      # corners by about this much.
      control_point_offset: 0.2
      # In-place rotations: toward the field when it points more than 90 degrees away, and to
      # the goal yaw at the end.
      use_rotate_to_field: true
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.5
      # Goal approach: brake over this path length, at least desired_speed^2 / max_linear_decel.
      terminal_braking_distance: 0.5
      min_approach_speed: 0.05
      # Obstacles come from the local costmap. none: stop before a blocking obstacle and let
      # Nav2 replan; contour: drive around it when the path ahead is blocked.
      obstacle_mode: "contour"
      use_collision_detection: true
      collision_check_horizon: 1.5
      stop_margin: 0.1

# The controller's command goes through the smoother. Its limits must be at least the
# controller's on every axis (decelerations negative), or it clips single axes and bends the
# path; scale_velocities keeps the curvature when a limit binds anyway. y is zero for a base
# without lateral motion.
velocity_smoother:
  ros__parameters:
    scale_velocities: true
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# Jazzy and later: navigation_launch.py chains controller_server (cmd_vel_nav) ->
# velocity_smoother (cmd_vel_smoothed) -> collision_monitor -> cmd_vel. Keep your distro's stock
# collision_monitor section; the keys below are the ones that interact with the controller.
# The stock approach polygon slows the robot when its footprint would reach a scan point within
# time_before_collision; the controller has its own braking cap (collision_check_horizon,
# stop_margin), so the monitor is a second line of defence. A "limit" polygon caps the speed in
# its zone: give it linear_limit >= max_linear_vel and angular_limit >= max_angular_vel unless
# the cap is intended. Humble's navigation_launch.py has no collision_monitor: add one as
# vectorfield_bringup does (config/humble/collision_monitor.yaml, cmd_vel -> cmd_vel_safe).
collision_monitor:
  ros__parameters:
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      time_before_collision: 1.2
      simulation_time_step: 0.1
