# Motion-model overlay for a skid-steer base.
# vectorfield_bringup.params.merge() deep-merges it onto nav2_bringup's nav2_params.yaml and
# replaces FollowPath wholesale. Unlisted controller parameters keep their defaults
# (vectorfield_ros/params/vectorfield_common_params.yaml), which validate with the stock
# 3 x 3 m local costmap and the TB3 footprint in both obstacle modes.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "vectorfield_nav2_controller::VectorFieldController"
      motion_model: "skid_steer"
      # The demos contour around unmapped obstacles; none only stops before them.
      obstacle_mode: "contour"
      # Defaults, restated because the velocity_smoother limits below must not be lower.
      desired_speed: 0.4
      max_linear_vel: 0.5
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 3.2
      # Floor of in-place rotations, to overcome the static friction of skidding wheels.
      min_in_place_angular_vel: 0.25
      # Slip compensation, off. Identify both on the real robot before setting them: the
      # measured over the commanded yaw rate of a slow in-place turn (IMU, not wheel odometry),
      # and the body-x of the centre of rotation from base_link's lateral drift in a turn
      # (docs/motion_models.md, "Skid-steer slip compensation"). Wrong values over-steer.
      # kinematic_sim_demo sets them to vectorfield_sim's slip (0.75, 0.05).
      skid_yaw_rate_efficiency: 1.0
      skid_icr_offset: 0.0

# Only the motion-model overlays set these, as full [x, y, theta] lists: x and theta at least the
# controller limits (decelerations negative), y zero for a base without lateral motion.
velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

# kinematic_sim_demo: the simulated base matches the controller; vectorfield_sim adds its skid
# slip (slip_eta_psi, slip_x_icr).
vectorfield_sim:
  ros__parameters:
    motion_model: "skid_steer"
