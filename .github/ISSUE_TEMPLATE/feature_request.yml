name: Feature request
description: Propose a new feature or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the roadmap in the README and the existing issues first.
        Changes to stable surfaces (plugin type, parameter names, topics, actions, messages) follow the support policy in CONTRIBUTING.md.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Nav2 controller plugin (vectorfield_nav2_controller)
        - Curve follower (vectorfield_curve_follower)
        - Behaviour-tree node (vectorfield_behavior_tree)
        - Core library (vectorfield_core)
        - Python bindings or tools (vectorfield_py)
        - Simulator, bringup or demos
        - Messages (vectorfield_msgs)
        - Visualization (RViz, Foxglove)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behaviour, parameters or interfaces you would like. References to the paper or thesis are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Does this change a stable surface (parameter names or semantics, topics, actions, messages, plugin type)?
      options:
        - No, additive only
        - Yes, breaking change
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
