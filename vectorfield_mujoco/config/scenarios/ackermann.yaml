# Scenario of ackermann.launch.py: the own car on open_10x10 (vectorfield_mujoco.examples). Smac
# Hybrid-A* (DUBIN, the Ackermann overlay) plans a straight, forward-only path; an unmapped box
# stands right next to it, which the global costmap does not see (no obstacle layer). The box's
# face is 0.1 m from the path, so the car's body (0.125 m half width) would scrape it: the
# controller's CBF safety filter (obstacle_mode cbf) keeps the barrier disc about the rear axle
# and its turning margin clear of the box, so the car swerves around it and returns to the path.
description: "Car swerves around a box next to its path with the CBF filter"

initial_pose: [-2.5, 0.0, 0.0]

# 0.5 m tall: the lidar plane is at 0.195 m. Its near face is at y = 0.1 m.
obstacles:
  - {type: box, pos: [0.0, 0.25], size: [0.15, 0.15, 0.25]}

waypoints:
  - [2.5, 0.0, 0.0]

params:
  controller_server:
    ros__parameters:
      FollowPath:
        obstacle_mode: "cbf"
  # Plan once and replan only if the path becomes invalid (also a stock tree with no Spin). The
  # overlay's 1 Hz replanning starts each Hybrid-A* search at the car's pose, and a new path
  # that bends a few centimetres toward the unseen box can steer the car to the box's side,
  # from where it cannot turn away in time; with one straight path the CBF does the swerve.
  bt_navigator:
    ros__parameters:
      default_nav_to_pose_bt_xml: "navigate_w_replanning_only_if_path_becomes_invalid.xml"
  global_costmap:
    global_costmap:
      ros__parameters:
        plugins: ["static_layer", "inflation_layer"]

# How record_path films it (record_gallery.sh's clip): a camera following the car from the side
# of the swerve; the clip leaves out the curve's rays, the evaluation point, the field's terms
# (their sum F stays), the command's arc and the braking zone, and draws the robot's path.
recording:
  camera: follow
  view: {distance: 2.8, azimuth: 90.0, elevation: -45.0, height: 0.0}
  hide: [curve/1, control_point, field/0, field/1, field/2, command/1, goal/5]
  trail: 60.0
