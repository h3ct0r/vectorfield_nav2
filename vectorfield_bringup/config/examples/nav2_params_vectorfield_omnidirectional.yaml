# Template: the vector-field controller in your own Nav2 parameter file, omnidirectional
# (holonomic) base.
#
# Copy each block into the section of the same name in your nav2_params.yaml (merge, do not
# append a second section), then replace the limits with your robot's. Keys not listed keep their
# defaults (docs: Parameters). The values below are the defaults for a TurtleBot-sized base with
# the stock 3 m x 3 m local costmap; they validate without warnings in both obstacle modes.
# The footprint is not set here: the controller reads it from the local costmap.
#
# Check the file before deploying:
#   vf-tune nav2_params.yaml
# and read controller_server's log at configure time (docs: Tuning guide, "Validator findings").
#
# Tutorial: docs/tutorials/your_robot.md.

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # The stock 0.5 zeroes every measured lateral speed below 0.5 m/s, so the controller would
    # never see the base move sideways.
    min_y_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["general_goal_checker"]
    # Position and yaw: the base turns to the goal yaw in place once it has stopped on the goal.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: "vectorfield_nav2_controller::VectorFieldController"
      # Read-only: set before the controller is configured. tracking_law auto selects the
      # holonomic law: the base velocity is the field, in the body frame.
      motion_model: "omnidirectional"
      tracking_law: "auto"
      # The yaw is independent of the motion: face the path tangent (path_tangent), the field
      # (field), or keep it (fixed).
      omni_heading_policy: "path_tangent"
      heading_gain: 2.0
      # The base's real limits; max_lateral_vel bounds the body y speed.
      max_linear_vel: 0.5
      max_lateral_vel: 0.5
      max_angular_vel: 1.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 3.2
      # The field: speed along the path (at most max_linear_vel) and convergence gain (1/m).
      desired_speed: 0.4
      convergence_gain: 2.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.5
      # Goal approach: brake over this path length, at least desired_speed^2 / max_linear_decel.
      terminal_braking_distance: 0.5
      min_approach_speed: 0.05
      # Obstacles come from the local costmap. none: stop before a blocking obstacle and let
      # Nav2 replan; contour: drive around it when the path ahead is blocked.
      obstacle_mode: "contour"
      use_collision_detection: true
      collision_check_horizon: 1.5
      stop_margin: 0.1

# Every axis at least the controller's limits (decelerations negative). The stock y = 0 would
# clamp every lateral command to zero, so y is symmetric and at least max_lateral_vel.
velocity_smoother:
  ros__parameters:
    scale_velocities: true
    max_velocity: [0.5, 0.5, 2.0]
    min_velocity: [-0.5, -0.5, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]

# Jazzy and later: controller_server (cmd_vel_nav) -> velocity_smoother (cmd_vel_smoothed) ->
# collision_monitor -> cmd_vel. Keep your distro's stock collision_monitor section; the keys
# below are the ones that interact with the controller (see the differential template). Humble:
# add a collision_monitor as vectorfield_bringup does (config/humble/collision_monitor.yaml).
collision_monitor:
  ros__parameters:
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      time_before_collision: 1.2
      simulation_time_step: 0.1
